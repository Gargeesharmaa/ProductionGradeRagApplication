version: "3.9"

services:

  api:
    build: .
    container_name: rag-api

    ports:
      - "8000:8000"

    env_file:
      - .env

    depends_on:
      - qdrant
      - redis

    volumes:
      - ./data:/app/data
      - ./logs:/app/logs

    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:latest

    container_name: qdrant

    ports:
      - "6333:6333"

    volumes:
      - qdrant_storage:/qdrant/storage

    restart: unless-stopped

  redis:
    image: redis:7-alpine

    container_name: redis

    ports:
      - "6379:6379"

    restart: unless-stopped

volumes:
  qdrant_storage: